<!DOCTYPE html>
<html lang="[[[LANG]]]" dir="[[[DIR]]]" class="theme-[[[THEME]]]">
    <head>
        <meta charset="UTF-8">
        <title data-i18n-label="page.title" data-i18n-target="text"></title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" data-i18n-label="page.description" data-i18n-target="attr-content">

        <link rel="canonical" href="https://schoolivate.vercel.app/[[[LANG]]]/[[[ORIGINAL_URI]]]">
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
        [[[LINK_REL_ALTERNATE]]]

        <meta property="og:type" content="website">
        <meta property="og:url" content="https://schoolivate.vercel.app/[[[LANG]]]/[[[CURRENT_URI]]]">
        <meta property="og:title" data-i18n-label="page.og.title" data-i18n-target="attr-content">
        <meta property="og:description" data-i18n-label="page.og.description" data-i18n-target="attr-content">
        <meta property="og:image" data-i18n-label="page.og.image.url" data-i18n-target="attr-content">
        <meta property="og:image:width" data-i18n-label="page.og.image.width" data-i18n-target="attr-content">
        <meta property="og:image:height" data-i18n-label="page.og.image.height" data-i18n-target="attr-content">
        <meta property="og:site_name" content="Schoolivate">
        <meta property="og:locale" content="[[[LANG_AREA]]]">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" data-i18n-label="page.og.title" data-i18n-target="attr-content">
        <meta name="twitter:description" data-i18n-label="page.og.description" data-i18n-target="attr-content">
        <meta name="twitter:image" data-i18n-label="page.og.image.url" data-i18n-target="attr-content">

        <link rel="icon" href="/assets/images/favicon.ico" sizes="any">
        <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <meta name="color-scheme" content="light dark" />
        [[[META_THEME_COLOR]]]

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preload" href="/assets/fonts/main-font.woff2" as="font" type="font/woff2" crossorigin>

        <script type="application/ld+json" data-i18n-label="page.title" data-i18n-target="replace">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": "https://schoolivate.vercel.app/#organization",
              "name": "Schoolivate",
              "url": "https://schoolivate.vercel.app",
              "logo": "https://schoolivate.vercel.app/assets/images/logo.png"
            },
            {
              "@type": "WebSite",
              "@id": "https://schoolivate.vercel.app/#website",
              "url": "https://schoolivate.vercel.app",
              "name": "Schoolivate",
              "publisher": {
                "@id": "https://schoolivate.vercel.app/#organization"
              }
            },
            {
              "@type": "WebPage",
              "@id": "https://schoolivate.vercel.app/[[[LANG]]]/[[[CURRENT_URI]]]#webpage",
              "url": "https://schoolivate.vercel.app/[[[LANG]]]/[[[CURRENT_URI]]]",
              "name": "|||i18n-replace|||",
              "isPartOf": {
                "@id": "https://schoolivate.vercel.app/#website"
              },
              "about": {
                "@id": "https://schoolivate.vercel.app/#organization"
              }
            }
          ]
        }
        </script>
        <template id="i18n-init-vars">
            {
                
            }
        </template>
        [[[LOADING_STYLES]]]
    </head>

        [[[LOADING_HTML]]]

</html>
