<!DOCTYPE html>
<html lang="[[[LANG]]]">
    <head>
        <meta charset="UTF-8">
        <title data-i18n-label="page.title"></title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" data-i18n-label="page.description" data-i18n-target="content">

        <link rel="canonical" href="https://schoolivate.vercel.app">
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
        <link rel="alternate" hreflang="en" href="https://schoolivate.vercel.app/en">
        <link rel="alternate" hreflang="ar" href="https://schoolivate.vercel.app/ar">
        <link rel="alternate" hreflang="x-default" href="https://schoolivate.vercel.app">

  <!-- 3. Social Media Cards (Open Graph & Twitter) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://schoolivate.vercel.app">
  <meta property="og:title" data-i18n-label="page.og.title" data-i18n-target="content">
  <meta property="og:description" data-i18n-label="page.og.description" data-i18n-target="content">
  <meta property="og:image" data-i18n-label="page.og.image.url" data-i18n-target="content">
  <meta property="og:image:width" data-i18n-label="page.og.image.width" data-i18n-target="content">
  <meta property="og:image:height" data-i18n-label="page.og.image.height" data-i18n-target="content">
  <meta property="og:site_name" content="Schoolivate">
  <meta property="og:locale" content="[[[LANG_AREA]]">
  
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@yourhandle">
  <meta name="twitter:title" content="Primary Page Title">
  <meta name="twitter:description" content="Concise summary of page content.">
  <meta name="twitter:image" content="https://example.com/images/og-cover.jpg">

  <!-- 4. Favicons & Browser UI -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">

  <!-- 5. Resource Hints & Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="/fonts/main-font.woff2" as="font" type="font/woff2" crossorigin>

  <!-- 6. Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Your Brand Name",
    "url": "https://example.com",
    "logo": "https://example.com/logo.png"
  }
  </script>
</head>
